services:
  - type: web
    name: osurvey
    runtime: node
    plan: free
    # The committed lockfile has an optional, cross-platform dependency tree
    # that npm rejects on Render's Linux hosts. Install from package.json here.
    buildCommand: npm install --package-lock=false --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      # Canonical domain used in metadata, structured data and sitemap.
      - key: NEXT_PUBLIC_SITE_URL
        value: https://www.lutexspatial.com
      - key: GOOGLE_SHEETS_WEB_APP_URL
        sync: false
      - key: GOOGLE_SHEETS_WEB_APP_TOKEN
        sync: false
