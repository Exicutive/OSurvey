  <g fill="#06174b" font-family="Arial, sans-serif"><text x="77" y="91" font-size="25" font-weight="700" letter-spacing="5">GIS / GEOSPATIAL MODEL</text><text x="79" y="130" font-size="15" fill="#4d5a7a" letter-spacing="3">CAPTURE · ANALYSE · COMMUNICATE</text></g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#fff"><text x="418" y="300">CONTROL 01</text><text x="695" y="165">CONTROL 02</text><text x="954" y="97">CONTROL 03</text></g>
