  <rect width="1200" height="800" fill="#f1f6ff"/><rect width="1200" height="800" fill="url(#grid)"/>
  <path d="M0 608 129 490 260 548 401 309 535 407 678 174 797 282 937 106 1200 255V800H0Z" fill="url(#ground)"/>
  <g fill="none" stroke="#ffb08b" stroke-width="4" opacity=".92"><path d="M0 645 130 531 260 589 401 350 535 448 678 215 797 323 937 147 1200 296"/><path d="M0 690 132 577 262 635 403 397 537 495 680 263 799 371 939 195 1200 344"/><path d="M0 736 134 623 264 681 405 445 539 543 682 311 801 419 941 243 1200 393"/></g>
